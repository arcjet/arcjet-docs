name: Playwright tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  merge_group:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Based on https://playwright.dev/docs/test-sharding#github-actions-example

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Starlight's `lastUpdated` and the sitemap's `<lastmod>` both read the
          # newest commit date per page. A shallow clone reports the checkout
          # commit for every file, so the whole site would claim to have changed
          # on every build. Full history keeps those dates real.
          fetch-depth: 0
          # Those dates come from commit metadata, so the history of file
          # contents is never read. Skipping it keeps the clone off the 3.5 GiB
          # of superseded screenshot blobs in the pack, which is what pushed
          # this step to 395s and cancelled the job against its 10 minute cap.
          # Anything that does ask for an old blob still gets it, fetched on
          # demand.
          filter: blob:none
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: setup-node
        with:
          cache: npm
          node-version: lts/*
      # setup-node bundles whichever npm ships with Node, so install the
      # version pinned in package.json explicitly.
      - name: Install pinned npm
        run: npm install -g npm@12.0.1
      # node_modules holds native modules compiled against one Node major's
      # ABI, so the cache key has to change when that major does. arcjet/arcjet
      # writes the major into the key by hand because it pins `node-version:
      # 24`; this repository tracks `lts/*`, so read the major back off
      # setup-node instead and the key follows an LTS rollover on its own.
      - name: Record Node major version
        env:
          NODE_VERSION: ${{ steps.setup-node.outputs.node-version }}
        run: echo "NODE_MAJOR=${NODE_VERSION%%.*}" >> "$GITHUB_ENV"
      # `npm ci` takes 54s and ran six times per workflow: once here, once in
      # each of the four shards, and once in `merge-reports`. setup-node's
      # `cache: npm` caches the npm download cache, not the installed tree, so
      # the install still linked 1562 packages every time. Caching node_modules
      # itself skips the install outright on an exact hit.
      #
      # The key hashes the lockfile, every package.json, and patches/**. The
      # lockfile alone is not enough: `prepare` runs `patch-package`, so a tree
      # restored after a patch changed would be silently unpatched, which fails
      # at runtime rather than at install. Hashing every package.json keeps a
      # metadata edit without a matching lockfile update from skipping `npm
      # ci`'s consistency check.
      #
      # Restore and save are separate steps rather than plain actions/cache
      # because the combined action's implicit save only runs when the job
      # succeeds, so one flaky test run would starve the cache.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            snippets/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_MAJOR }}-${{ hashFiles('package-lock.json', 'package.json', 'snippets/*/package.json', 'patches/**') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # Saved immediately after `npm ci`, before the build can write tool caches
      # into the tree (Astro's .astro/, Nuxt's node_modules/.cache), so the
      # cached content is exactly what the install produced. A failed install
      # never reaches this step, so a broken tree cannot be seeded.
      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        # Seeding a cache is an optimization: no write failure may fail the job.
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            snippets/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_MAJOR }}-${{ hashFiles('package-lock.json', 'package.json', 'snippets/*/package.json', 'patches/**') }}
      # `npm ci` runs `prepare`, which is `patch-package && npm --workspaces run
      # check`. Nothing else type checks the three snippet workspaces, and
      # nothing else runs `nuxt prepare` to generate snippets/nuxt/.nuxt, so
      # when the install is skipped those checks have to run on their own. The
      # patches are already applied in the cached tree, which is why patches/**
      # is in the key above.
      - name: Check snippet workspaces
        if: steps.node-modules.outputs.cache-hit == 'true'
        run: npm --workspaces run check
      - name: Build
        run: npm run build
        env:
          # We need an Arcjet key for the dev server to run, but it doesn't
          # actually need to be valid for the tests to run.
          ARCJET_KEY: ajkey_dummy
          # See astro.config.mts for context.
          ASTRO_FORCE_NODE_ADAPTER: "1"
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: dist/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: setup-node
        with:
          cache: npm
          node-version: lts/*
      - name: Install pinned npm
        run: npm install -g npm@12.0.1
      - name: Record Node major version
        env:
          NODE_VERSION: ${{ steps.setup-node.outputs.node-version }}
        run: echo "NODE_MAJOR=${NODE_VERSION%%.*}" >> "$GITHUB_ENV"
      # Same key and paths as `build`, whose save has already run by the time a
      # shard starts, so a shard hits the cache even on the run that seeds it.
      # See the comments there for the key and the split restore/save. The
      # snippet workspace checks are not repeated here: they are a property of
      # the source, `build` runs them once, and a shard only needs node_modules
      # to serve dist/ and drive Playwright.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            snippets/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_MAJOR }}-${{ hashFiles('package-lock.json', 'package.json', 'snippets/*/package.json', 'patches/**') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        # Seeding a cache is an optimization: no write failure may fail the job.
        # All four shards race for this key on a miss; the first wins and the
        # rest log a benign "unable to reserve cache" notice.
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            snippets/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_MAJOR }}-${{ hashFiles('package-lock.json', 'package.json', 'snippets/*/package.json', 'patches/**') }}
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: dist/
      - name: Install Playwright Browsers
        run: npm run pw:install
      - name: Run Playwright tests
        run: npm run pw:run -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  merge-reports:
    # Failing tests still produce blob reports worth merging, so this runs when
    # `test` fails. It must not run when `test` never ran: an upstream failure
    # leaves no reports, `merge-reports` fails on the empty directory, and the
    # PR shows a report-merging failure instead of the real cause.
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    needs: test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: setup-node
        with:
          cache: npm
          node-version: lts/*
      - name: Install pinned npm
        run: npm install -g npm@12.0.1
      - name: Record Node major version
        env:
          NODE_VERSION: ${{ steps.setup-node.outputs.node-version }}
        run: echo "NODE_MAJOR=${NODE_VERSION%%.*}" >> "$GITHUB_ENV"
      # Same key and paths as `build`; see the comments there. This job only
      # needs Playwright itself, to run `merge-reports`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            snippets/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_MAJOR }}-${{ hashFiles('package-lock.json', 'package.json', 'snippets/*/package.json', 'patches/**') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        # Seeding a cache is an optimization: no write failure may fail the job.
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            snippets/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_MAJOR }}-${{ hashFiles('package-lock.json', 'package.json', 'snippets/*/package.json', 'patches/**') }}
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
